spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workmark}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        sslmode: ${DB_SSL_MODE:disable}
  jpa:
    show-sql: false
logging:
  level:
    com.workmark: DEBUG
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  api-docs:
    public: true

