spring:
  application:
    name: workmark
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:workmark}
    audience: ${JWT_AUDIENCE:workmark-api}
  auth:
    activation-token-ttl: ${ACCOUNT_ACTIVATION_TTL:PT24H}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
    password-reset-cooldown: ${PASSWORD_RESET_COOLDOWN:PT60S}
    outbox:
      encryption-key: ${ACCOUNT_TOKEN_OUTBOX_KEY:}
      poll-interval-ms: ${ACCOUNT_TOKEN_OUTBOX_POLL_INTERVAL_MS:10000}
      batch-size: ${ACCOUNT_TOKEN_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${ACCOUNT_TOKEN_OUTBOX_MAX_ATTEMPTS:8}
      base-retry-delay: ${ACCOUNT_TOKEN_OUTBOX_BASE_RETRY_DELAY:PT5S}
      max-retry-delay: ${ACCOUNT_TOKEN_OUTBOX_MAX_RETRY_DELAY:PT1H}
      processing-lease: ${ACCOUNT_TOKEN_OUTBOX_PROCESSING_LEASE:PT2M}
      retention: ${ACCOUNT_TOKEN_OUTBOX_RETENTION:PT720H}
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT5M}
      base-block: ${LOGIN_RATE_LIMIT_BASE_BLOCK:PT30S}
      max-block: ${LOGIN_RATE_LIMIT_MAX_BLOCK:PT15M}
      max-tracked-keys: ${LOGIN_RATE_LIMIT_MAX_TRACKED_KEYS:100000}
      ip-max-failures: ${LOGIN_RATE_LIMIT_IP_MAX_FAILURES:20}
      reset-max-failures: ${PASSWORD_RESET_MAX_FAILURES:3}
      reset-ip-max-failures: ${PASSWORD_RESET_IP_MAX_FAILURES:10}
      reset-max-tracked-keys: ${PASSWORD_RESET_MAX_TRACKED_KEYS:100000}
      trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
  api-docs:
    public: ${SWAGGER_PUBLIC:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    super-admin:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      name: ${SUPER_ADMIN_NAME:}
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
