services:
  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres-tls/server.crt
      - -c
      - ssl_key_file=/run/postgres-tls/server.key
    volumes:
      - ${POSTGRES_TLS_CERT_PATH:?Set POSTGRES_TLS_CERT_PATH}:/run/postgres-tls/server.crt:ro
      - ${POSTGRES_TLS_KEY_PATH:?Set POSTGRES_TLS_KEY_PATH}:/run/postgres-tls/server.key:ro
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_SSL_MODE: verify-full
      SWAGGER_PUBLIC: "false"
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in your production environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in your production environment}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_SSL_TRUST: ${SMTP_SSL_TRUST:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
